name: Rule changes
on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: Previous GitHub release tag, or 'initial' for the first release
        required: true
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Compare shipped lint presets
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          install_and_build() (
            cd "$1"
            package_manager=$(node -p "require('./package.json').packageManager")
            npm exec --yes --package="$package_manager" -- pnpm install --frozen-lockfile --ignore-scripts
            npm run build
          )

          baseline=--initial
          if [[ "$PREVIOUS_TAG" != initial ]]; then
            previous_commit=$(git rev-parse --verify "refs/tags/$PREVIOUS_TAG^{commit}")
            git merge-base --is-ancestor "$previous_commit" HEAD
            if [[ "$previous_commit" == "$(git rev-parse HEAD)" ]]; then
              echo 'Choose a previous release tag.' >&2
              exit 1
            fi
            baseline="$RUNNER_TEMP/previous-release"
            git worktree add --detach "$baseline" "$previous_commit"
            install_and_build "$baseline"
          fi
          install_and_build "$GITHUB_WORKSPACE"
          {
            node scripts/rule-changes.ts "$baseline"
            printf '\nCandidate commit: `%s`\n' "$(git rev-parse HEAD)"
            if [[ "$baseline" != --initial ]]; then
              printf '\nPrevious commit: `%s`\n' "$previous_commit"
            fi
          } > "$RUNNER_TEMP/rule-changes.md"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/rule-changes.md
          archive: false
          if-no-files-found: error
