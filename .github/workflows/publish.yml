name: Stage Publish
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify the rule changes report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          report="$RUNNER_TEMP/rule-changes.md"
          gh release download --pattern rule-changes.md --output "$report" -- "$RELEASE_TAG"
          node scripts/release-report.ts verify "$report"
      - uses: stevezhu/actions/npm-publish@v3
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
